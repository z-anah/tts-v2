<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>1080×1080 Grid Generator</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:20px;
    background:#f5f5f5;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

label{
    display:flex;
    align-items:center;
    gap:6px;
}

input{
    width:80px;
    padding:6px;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

canvas{
    border:1px solid #999;
    background:#fff;
    max-width:700px;
    width:100%;
    height:auto;
}
</style>
</head>
<body>

<div class="controls">
    <label>Rows
        <input id="rows" type="number" min="1" value="5">
    </label>

    <label>Columns
        <input id="cols" type="number" min="1" value="5">
    </label>

    <button onclick="generate()">Generate</button>
    <button onclick="downloadImage()">Download PNG</button>
</div>

<canvas id="canvas" width="1080" height="1080"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function generate(){

    const rows = Math.max(1, parseInt(document.getElementById("rows").value));
    const cols = Math.max(1, parseInt(document.getElementById("cols").value));

    ctx.clearRect(0,0,1080,1080);

    ctx.fillStyle="white";
    ctx.fillRect(0,0,1080,1080);

    const cellW = 1080 / cols;
    const cellH = 1080 / rows;

    ctx.strokeStyle="#000";
    ctx.lineWidth=2;

    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){

            const x = c * cellW;
            const y = r * cellH;

            ctx.strokeRect(x,y,cellW,cellH);
        }
    }

    const totalCells = rows * cols;
    alert(`Total Cells: ${totalCells}`);
}

function downloadImage(){
    const link=document.createElement("a");
    link.download="grid_1080x1080.png";
    link.href=canvas.toDataURL("image/png");
    link.click();
}

generate();
</script>

</body>
</html>
